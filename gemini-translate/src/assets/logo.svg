<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Main circular background -->
  <circle cx="50" cy="50" r="45" fill="#4285f4" />
  
  <!-- White innermost circle representing Gemini's dual nature -->
  <circle cx="50" cy="50" r="35" fill="white" />
  
  <!-- Letter G stylized -->
  <path d="M50 22.5 A27.5 27.5 0 1 0 50 77.5 A27.5 27.5 0 1 0 50 22.5" fill="none" stroke="#4285f4" stroke-width="5" stroke-dasharray="137.5 34.4" />
  
  <!-- Gemini twin stars effect -->
  <circle cx="38" cy="38" r="6" fill="#fbbc05" />
  <circle cx="62" cy="62" r="6" fill="#34a853" />
  
  <!-- Translation lines -->
  <line x1="27" y1="50" x2="73" y2="50" stroke="#ea4335" stroke-width="3" stroke-dasharray="5,3" />
  <line x1="30" y1="42" x2="70" y2="42" stroke="#34a853" stroke-width="2" stroke-dasharray="3,2" />
  <line x1="30" y1="58" x2="70" y2="58" stroke="#fbbc05" stroke-width="2" stroke-dasharray="3,2" />
</svg>
